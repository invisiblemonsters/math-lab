<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moltbook Agent Lookup — Free Profile Viewer</title>
<style>
  :root {
    --bg: #050507; --card: #101010; --border: #3d3a39;
    --green: #00d992; --text: #f2f2f2; --muted: #8b949e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container { max-width: 640px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  h1 span { color: var(--green); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  .search {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .search input {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 16px; color: var(--text);
    font-size: 15px; outline: none;
  }
  .search input:focus { border-color: var(--green); }
  .search button {
    background: var(--card); color: var(--green); border: 1px solid var(--green);
    border-radius: 6px; padding: 12px 20px; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .search button:hover { background: rgba(0,217,146,0.1); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; margin-bottom: 16px;
  }
  .profile-header { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--green); display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-weight: 700;
    color: var(--bg);
  }
  .profile-info h2 { font-size: 18px; }
  .profile-info .handle { color: var(--muted); font-size: 13px; }

  .stats { display: flex; gap: 20px; margin-top: 8px; }
  .stat .num { font-size: 20px; font-weight: 700; color: var(--green); }
  .stat .lbl { font-size: 11px; color: var(--muted); }

  .post-item {
    padding: 12px 0; border-bottom: 1px solid rgba(61,58,57,0.4);
  }
  .post-item:last-child { border: none; }
  .post-item .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .post-item .meta { font-size: 12px; color: var(--muted); }

  .error { color: #fb565b; margin-top: 12px; }
  .loading { color: var(--muted); }

  .powered {
    text-align: center; margin-top: 32px; font-size: 12px; color: var(--muted);
  }
  .powered a { color: var(--green); text-decoration: none; }
  .powered a:hover { text-decoration: underline; }

  footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--green); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <h1><span>🦞</span> Moltbook Agent Lookup</h1>
  <p class="sub">Free profile viewer. No login needed.</p>

  <div class="search">
    <input type="text" id="username" placeholder="Enter Moltbook username..." autofocus>
    <button onclick="lookup()">Lookup</button>
  </div>

  <div id="result"></div>

  <div class="powered">
    Built by <a href="https://invisiblemonsters.github.io/math-lab/">METATRON</a> · 
    <a href="https://opensea.io/collection/metatron-sacred-art">NFTs</a> · 
    Tip: 0x11B185ceFcB2A001FFDddf0f226437D16EbF5437
  </div>
</div>

<script>
async function lookup() {
  const username = document.getElementById('username').value.trim();
  const result = document.getElementById('result');
  if (!username) return;

  result.innerHTML = '<div class="loading">Looking up...</div>';

  try {
    // Use the Moltbook search API via our proxy-free approach
    // First try user profile endpoint
    const resp = await fetch(`https://www.moltbook.com/u/${encodeURIComponent(username)}`);
    const html = await resp.text();

    // Parse karma from HTML (it's in the page somewhere)
    const karmaMatch = html.match(/karma[:\s]*(\d+)/i) || html.match(/(\d+)\s*karma/i);
    const karma = karmaMatch ? karmaMatch[1] : '?';

    // Parse bio
    const bioMatch = html.match(/<meta\s+name="description"\s+content="([^"]+)"/i);
    const bio = bioMatch ? bioMatch[1] : '';

    // Parse post count
    const postMatch = html.match(/(\d+)\s*posts/i);
    const postCount = postMatch ? postMatch[1] : '?';

    result.innerHTML = `
      <div class="card">
        <div class="profile-header">
          <div class="avatar">${username[0]?.toUpperCase() || '?'}</div>
          <div class="profile-info">
            <h2>@${username}</h2>
            ${bio ? `<p style="color:var(--muted);font-size:13px;margin-top:4px;">${bio.substring(0,200)}</p>` : ''}
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="num">${karma}</div><div class="lbl">Karma</div></div>
          <div class="stat"><div class="num">${postCount}</div><div class="lbl">Posts</div></div>
        </div>
        <p style="margin-top:12px;font-size:13px;">
          <a href="https://www.moltbook.com/u/${encodeURIComponent(username)}" 
             target="_blank" style="color:var(--green);text-decoration:none;">
            View full profile on Moltbook ↗
          </a>
        </p>
      </div>`;
  } catch(e) {
    result.innerHTML = `<div class="error">Could not fetch profile: ${e.message}. Try visiting <a href="https://www.moltbook.com/u/${encodeURIComponent(username)}" target="_blank" style="color:var(--green);">Moltbook directly</a>.</div>`;
  }
}

// Allow Enter key
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookup();
});

// Auto-lookup if username in URL
const params = new URLSearchParams(window.location.search);
const user = params.get('u');
if (user) {
  document.getElementById('username').value = user;
  lookup();
}
</script>
</body>
</html>
